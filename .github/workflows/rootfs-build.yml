name: rootfs-build

# 独立构建：不需要内核仓库，也不需要连设备。
# 固件与内核模块从本仓库的 release 资产取（tag: fw-YYYYMMDD）。
on:
  workflow_dispatch:
    inputs:
      package_set:
        description: '包集：sda37 = 按 deps/lists/sda37.list 全量对齐在役机；level = 按档位'
        required: true
        default: sda37
        type: choice
        options: [sda37, level]
      level:
        description: '基础包档位（package_set=level 时生效）'
        required: false
        default: standard
        type: choice
        options: [minimal, standard, full]
      suite:
        description: 'Ubuntu 版本'
        required: true
        default: resolute
      fw_tag:
        description: '固件资产所在的 release tag'
        required: true
        default: fw-20261020
      kver:
        description: '内核版本号（要等于 fw/modules 下的目录名）'
        required: true
        default: 7.3.0-rc5-crux73
      publish_release:
        description: '构建成功后发 Release（否则只留 artifact）'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      MIRROR: http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap zstd rsync ca-certificates

      - name: 取固件与内核模块（release 资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download "${{ inputs.fw_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'crux-fw-modules-*.tar.zst' --dir .
          ls -lh crux-fw-modules-*.tar.zst
          tar --zstd -xf crux-fw-modules-*.tar.zst
          test -d fw/firmware && test -d fw/modules
          echo "固件: $(du -sh fw/firmware | cut -f1)   模块: $(du -sh fw/modules | cut -f1)"
          echo "模块版本目录: $(ls fw/modules)"

      - name: 构建 rootfs 包
        run: |
          set -e
          if [ "${{ inputs.package_set }}" = "sda37" ]; then
            echo "包集: 对齐在役机 sda37（$(wc -l < deps/lists/sda37.list) 个包）"
            sudo ./mkimage.sh "$PWD/out" \
              --fw-dir "$PWD/fw" \
              --selections "$PWD/deps/lists/sda37.list" \
              --root-label linux-root \
              --suite "${{ inputs.suite }}" \
              --mirror "$MIRROR" \
              --kver "${{ inputs.kver }}"
          else
            echo "包集: 档位 ${{ inputs.level }}"
            sudo ./mkimage.sh "$PWD/out" \
              --fw-dir "$PWD/fw" \
              --level "${{ inputs.level }}" \
              --root-label linux-root \
              --suite "${{ inputs.suite }}" \
              --mirror "$MIRROR" \
              --kver "${{ inputs.kver }}"
          fi
          ls -lh out/

      - name: 体检（关键路径必须在包内）
        run: |
          set -e
          T=$(ls out/*.tar.zst | head -1)
          L=/tmp/pkglist.txt
          tar -tf "$T" > "$L"          # 只解一次，之后全部查清单
          echo "条目数: $(wc -l < "$L")"
          miss=0
          for f in ./etc/fstab ./etc/crux-swap.conf ./usr/local/bin/crux-audio-route.sh \
                   ./etc/systemd/system/crux-audio-route.service \
                   ./usr/share/alsa/ucm2/conf.d/sm8150/sm8150.conf \
                   ./usr/lib/modules/${{ inputs.kver }}/kernel/drivers/crux/crux_esoc.ko \
                   ./usr/lib/modules/${{ inputs.kver }}/kernel/drivers/crux/npucc-sm8150.ko \
                   ./usr/lib/modules/${{ inputs.kver }}/kernel/drivers/crux/npu/msm_npu.ko \
                   ./usr/lib/modules/${{ inputs.kver }}/kernel/drivers/net/ipa/ipa_mhi_proxy.ko \
                   ./usr/lib/firmware/ath10k/WCN3990/hw1.0/firmware-5.bin \
                   ./usr/sbin/NetworkManager ./usr/bin/pipewire \
                   ./usr/sbin/qsee-supplicant ./usr/sbin/qsee-app-loader \
                   ./usr/local/sbin/crux-swap-setup.sh \
                   ./usr/sbin/gdm3 ./usr/bin/gnome-shell \
                   ./usr/share/wayland-sessions/ubuntu.desktop \
                   ./usr/local/bin/tqftpserv ./usr/local/bin/hexagonrpcd \
                   ./usr/local/lib/libqrtr.so.1 \
                   ./usr/local/bin/pd-mapper ./usr/local/bin/rmtfs \
                   ./etc/NetworkManager/conf.d/unmanaged-usb0.conf \
                   ./etc/systemd/system/multi-user.target.wants/ssh.service \
                   ./etc/systemd/system/display-manager.service; do
            if grep -qx -- "$f" "$L"; then
              echo "  OK   $f"
            else
              echo "  MISS $f"; miss=$((miss+1))
            fi
          done
          [ "$miss" = "0" ] || { echo "!! 缺失 $miss 项"; exit 1; }
          echo "启用链接数: $(grep -c 'multi-user.target.wants' "$L" || true)"
          echo "x50 误启用: $(grep 'x50' "$L" | grep -c wants || true)"
          # 产物不得包含 WiFi 认证数据
          n=$(grep -c 'etc/netplan/.*\.yaml' "$L" || true)
          echo "netplan yaml 数量（应为 0）: $n"
          [ "$n" = "0" ] || { echo "!! 产物里含 WiFi 认证数据"; exit 1; }
          echo "模块 ko 数: $(grep -c 'modules/.*\.ko$' "$L" || true)"
          echo "extra 目录条目（应为 0）: $(grep -c 'modules/.*/extra/' "$L" || true)"
          echo "gnome-shell 文件数: $(grep -c 'usr/share/gnome-shell' "$L" || true)"
          echo "home/crux 存在: $(grep -c '^\./home/crux' "$L" || true)"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish_release }}
        with:
          name: crux-rootfs-${{ inputs.suite }}-${{ inputs.package_set }}-${{ github.sha }}
          path: |
            out/*.tar.zst
            out/SHA256SUMS
          if-no-files-found: error

      - name: 发 Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="rootfs-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            -t "crux rootfs ${{ inputs.suite }} arm64 (${{ inputs.package_set }})" \
            -n "云端自动构建。包集=${{ inputs.package_set }}（sda37 时按 deps/lists/sda37.list 全量 1666 包对齐在役机，含 GNOME+gdm3）。产物含固件 + 内核模块 ${{ inputs.kver }}，不含 WiFi 认证数据。

          用法：解压到新根分区，改 grub 的 root=UUID，见仓库 README §3.1。
          默认 root 密码 root，登录后请改。" \
            out/*.tar.zst out/SHA256SUMS
