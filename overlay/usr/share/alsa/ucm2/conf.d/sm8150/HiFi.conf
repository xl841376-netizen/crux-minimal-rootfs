# crux / SM8150 / WCD934x + CS35L41
#
# 结构参照 alsa-ucm-conf 官方 SM8150 机型（Realme X3）的 HiFi.conf：
#   - 播放路由写在 SectionVerb 的 EnableSequence（ACP 会在 open PCM 之前应用它）
#   - SectionDevice 里只留 Value（Priority / PCM）
#
# 通路：
#   Speaker  : MultiMedia1 -> QUAT_MI2S_RX -> CS35L41 -> 外放扬声器
#   Earpiece : MultiMedia1 -> SLIMBUS_0_RX -> SLIM RX0 -> RX INT0 -> EAR 听筒

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speaker (QUAT_MI2S -> CS35L41)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece (WCD934x EAR)"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='EAR PA Volume' 4"
	]

	DisableSequence [
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}