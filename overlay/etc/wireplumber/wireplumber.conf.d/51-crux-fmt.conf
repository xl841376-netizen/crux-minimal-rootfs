# [crux 2026-10-20] UCM sink 强制 S16LE/48k/2ch (QUAT_MI2S -> CS35L41 只接受 2ch/S16_LE)
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
