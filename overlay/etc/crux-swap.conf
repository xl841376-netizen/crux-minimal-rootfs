# ============================================================
# crux swap 配置（由 crux-swap.service 调用 crux-swap-setup.sh 读取）
# ------------------------------------------------------------
# 设计原则：**默认全部关闭**，需要时显式打开。
#   原因：本机根分区本身就可能叫 linux-root（sda36/sda37 都可能），
#         磁盘 swapfile 依赖“另一块盘”，不能默认去碰分区；
#         zram 也可关，避免低内存外的一切默认行为。
#
# 改完生效：
#   systemctl restart crux-swap
#   systemctl is-enabled crux-swap   # 若已 disable，脚本不会跑
# ============================================================

# ---------- 总闸 ----------
# 0 = 完全禁用 swap（默认）：不建 zram、不建 swapfile，并把已有 swap 全部 swapoff
# 1 = 按下面各项启用
SWAP_ENABLE=0

# ---------- zram（内存压缩交换）----------
# 单位 MiB。0 = 不创建（默认）。典型值 4096。
# 仅在 SWAP_ENABLE=1 时生效
ZRAM_MB=0
ZRAM_PRIO=100

# ---------- 额外磁盘 swapfile ----------
# 1 = 在另一块 PARTLABEL=linux-root 分区上建 swapfile
#     若 / 所在分区本身就是 linux-root，脚本会自动跳过并告警
# 仅在 SWAP_ENABLE=1 时生效
LROOT_SWAP=0
LROOT_SWAP_MB=8192
SWAPFILE_PRIO=10

# ---------- 内核参数（仅在 SWAP_ENABLE=1 时应用）----------
SWAPPINESS=100
PAGE_CLUSTER=0
WATERMARK_BOOST=0
