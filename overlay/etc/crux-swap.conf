# crux swap 开关（由 crux-swap.service / crux-swap-setup.sh 读取）
#
# 0（默认）= 只用 zram 4GiB，不碰任何分区。
# 1         = 额外在 /mnt/lroot（PARTLABEL=linux-root，本机 sda36 64G）
#             上创建并启用 8GiB swapfile；此时需要该分区存在，且 fstab 里
#             有对应的 /mnt/lroot 挂载条目（或由脚本按 partlabel 自行挂载）。
#
# 默认关闭的原因：sda36 是可选分区，可能被删除并入根分区；不该让开机路径
# 默认依赖它。需要时改这一行即可，改完 systemctl restart crux-swap。
LROOT_SWAP=0
