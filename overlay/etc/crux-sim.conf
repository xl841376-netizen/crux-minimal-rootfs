# crux SIM / X50（外挂 sdx50m）开关
#
# 0（默认）= 完全不启用：整套 x50-* 单元、modprobe 参数、udev 规则都不进系统路径，
#            四颗内置子系统（mpss/adsp/cdsp/slpi）照常启动，SIM 侧不参与。
# 1         = 已通过 `crux-sim-x50 enable` 安装并启用。
#
# 整套文件常驻在 /opt/crux/sim-x50/（按系统绝对路径镜像），本身不产生任何效果；
# 只有执行 `crux-sim-x50 enable` 时才会铺回 /etc、/usr/local 并 enable 单元。
# 关闭：`crux-sim-x50 disable`。
SIM_X50_ENABLE=0
