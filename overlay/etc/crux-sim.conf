# crux SIM / X50（外挂 sdx50m）开关
#
# 这套东西是【本机专用】，文件就按原样待在系统路径里（/etc/systemd/system、/usr/local/…），
# 不搞镜像目录、不搞安装/卸载。
#
# 0（默认）= 单元文件在，但没有 enable → 开机不启动 → SIM 侧不参与，
#            基带只跑内置四个子系统（mpss/adsp/cdsp/slpi）。
# 1         = 已通过 `crux-sim-x50 enable` 把 x50-* 全部 enable。
#
# 切换：crux-sim-x50 {enable|disable|status}
SIM_X50_ENABLE=0
